[package]
name = "ssc-core"
version.workspace = true
edition.workspace = true

[dependencies]
unicode-segmentation = { workspace = true }
unicode-script = { workspace = true }
unicode-properties = { workspace = true }
# NFC normalization for uni.mixed-normalization (ADR 0063): canonical
# ordering, recursive decomposition, singleton mappings, and composition
# exclusions are non-trivial to reimplement correctly and must agree with
# JS `String.prototype.normalize` at the wasm boundary.
unicode-normalization = { workspace = true }
# Internal-only hot-path maps (casing interner/judge memo, rare-glyph walk
# maps, the token cache): fast non-cryptographic hashing, no_std-friendly,
# never touches a serialized map. See ADR 0057 allocation-diet follow-up.
rustc-hash = { workspace = true }
xxhash-rust = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tsify = { version = "0.5.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
criterion = "0.5"
# Corpus-level fan-out for the fleet survey (calibrate --fleet); dev-only —
# the library's own `parallel` feature stays optional and separate.
rayon = "1"
# Pre-parsed corpus blob cache (calibrate --build-blob): a plain binary
# serde round-trip, dev-tooling only — never touches core's own types.
bincode = "1.3"

[[bench]]
name = "analyze"
harness = false

[[bench]]
name = "floor"
harness = false
required-features = ["bench-probes"]

[features]
default = ["serde"]
serde = ["dep:serde"]
# Enables the Tsify derives that emit the TS string unions for `RuleId`
# and `Severity`. Turned on by the wasm crate; native Rust consumers never
# pull tsify/wasm-bindgen.
wasm = ["dep:tsify", "dep:wasm-bindgen", "serde"]
# Fans the per-verse analysis phase out over rayon (ADR 0018). Default-off:
# the wasm editor build stays single-threaded and pulls no rayon. Gated on
# the feature, not the target, so a future wasm-threads build (COOP/COEP +
# wasm-bindgen-rayon, init from JS) opts in with no core change. Output is
# identical to the serial path — `analyze_stateful` sorts findings either way.
parallel = ["dep:rayon"]
# Un-gates PrepCache's observability counters (`probe()`) as public API, so a
# downstream crate's tests (the shell) can assert cache-reuse and zero-re-tally
# invariants directly. Test-only infrastructure; carries no runtime cost off.
test-probes = []
# Un-gates `walk_floor`/`FloorNeeds` (benches/floor.rs only): the fused walk's
# per-verse substrate with zero rule listeners attached, so a bench can learn
# the floor cost any rule combination pays into before its own logic runs.
# Not part of the crate's real public API — no downstream consumer (galley,
# wasm) enables this feature; it exists only so the floor bench binary can
# reach the walk's private primitives without exposing them generally.
bench-probes = []
