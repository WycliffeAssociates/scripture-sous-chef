[package]
name = "ssc-core"
version.workspace = true
edition.workspace = true

[dependencies]
unicode-segmentation = { workspace = true }
unicode-script = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tsify = { version = "0.5.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
default = ["serde"]
serde = ["dep:serde"]
# Enables the Tsify derives that emit the TS string unions for `RuleId`
# and `Severity`. Turned on by the wasm crate; native Rust consumers never
# pull tsify/wasm-bindgen.
wasm = ["dep:tsify", "dep:wasm-bindgen", "serde"]
