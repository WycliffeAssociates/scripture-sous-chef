[package]
name = "ssc-ingest"
version.workspace = true
edition.workspace = true

[dependencies]
ssc-core = { workspace = true }
usfm_onion = { workspace = true, optional = true }
rayon = { workspace = true }

[features]
default = []
# Pulls in the `usfm` submodule and its `usfm_onion` dependency. Off by
# default so consumers that already speak `usfm_onion` (or that feed a
# pre-built `BTreeMap<Sid, String>` into `build::project_from_raw_map`)
# can depend on `ssc-ingest` without inheriting our pinned `usfm_onion`
# rev. Workspace binaries (the `sous` CLI) opt in explicitly.
usfm = ["dep:usfm_onion"]
