[package]
name = "ssc-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ssc-core = { workspace = true, features = ["wasm"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = "0.5.6"

[dev-dependencies]
serde_json = "1"
