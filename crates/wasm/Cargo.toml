[package]
name = "ssc-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ssc-core = { workspace = true, features = ["wasm"] }
ssc-galley = { workspace = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsify = "0.5.6"

[dev-dependencies]
serde_json = "1"

[features]
# Un-gates two `#[wasm_bindgen]` bench probes (`bench_synthetic_findings`,
# `bench_synthetic_findings_packed`) that synthesize `Finding`s and marshal
# them through the same wasm→JS boundary `analyze_vref` uses, with zero
# corpus/rule compute — isolates wasm→JS marshaling cost from the compute
# cost measured elsewhere. Not part of the crate's real public API; no
# downstream consumer (the editor) enables this. Carries no runtime cost
# when off.
bench-probes = []
