[package]
name = "ssc-galley"
version.workspace = true
edition.workspace = true

[dependencies]
ssc-core = { workspace = true }
rustc-hash = { workspace = true }

[features]
# Forward core's rayon per-verse fan-out (ADR 0018) so the shell can be
# exercised under both feature sets; the Galley itself stays single-threaded.
parallel = ["ssc-core/parallel"]

[dev-dependencies]
# The shell's tests read PrepCache::probe() to prove cache-reuse and
# zero-re-tally invariants directly across the crate boundary, and drive the
# core fault hook (ssc_core::fault) in the lifecycle retry-safety tests.
ssc-core = { workspace = true, features = ["test-probes"] }
# The resident incremental transcript oracle (examples/transcript_oracle.rs) and
# the warm-edit bench live here now (dependency-direction restore — ssc-core
# must not dev-depend on ssc-galley). The oracle #[path]-includes ssc-core's
# gate-critical shared helpers (dev/vref_io.rs, examples/calibrate/{oracle,
# corpus_blob}.rs), which pull these:
rayon = "1"        # corpus-level fan-out (same shape as the calibrate dumps)
serde_json = "1"   # write_findings' args column
serde = { version = "1", features = ["derive"] } # corpus_blob's BlobEntry derives
bincode = "1.3"    # corpus_blob preset cache
criterion = "0.5"  # warm_edit bench

# The editor's warm steady-state bench — resident Galley + update_book +
# analyze (was crates/core/benches/analyze.rs::galley_warm_edit_*).
[[bench]]
name = "warm_edit"
harness = false

[lints]
workspace = true
